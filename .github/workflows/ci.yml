name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - run: npm install --no-save --no-package-lock jsdom@26
      - name: Python policy tests
        run: python -m pytest -q
      - name: Model, UI contract and browser-flow tests
        run: node --test tests/*.cjs
      - name: Website asset and syntax checks
        run: |
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/enterprise.css
          node --check docs/model.js
          node --check docs/app.js
