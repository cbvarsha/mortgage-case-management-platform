<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearth — Mortgage Case Management</title><meta name="description" content="Interactive mortgage underwriting and case management workspace."><link rel="stylesheet" href="styles.css"></head><body>
<aside class="sidebar"><div class="brand">Hearth<small>People. Homes. Further.</small></div><nav><button class="nav active" data-view="case">▣ <span>Cases</span></button><button class="nav" data-view="tasks">☑ <span>Tasks</span><em>3</em></button><button class="nav" data-view="documents">▤ <span>Documents</span></button><button class="nav" data-view="underwriting">⌁ <span>Underwriting</span></button><button class="nav" data-view="valuations">⌂ <span>Valuations</span></button><button class="nav" data-view="communications">◇ <span>Communications</span></button><button class="nav" data-view="customers">♙ <span>Customers</span></button><button class="nav" data-view="reports">▥ <span>Reports</span></button></nav><div class="motto">A fairer<br>path to home.</div></aside>
<div class="shell"><header class="topbar"><label class="search">⌕ <input id="search" aria-label="Search cases" placeholder="Search cases, customers or documents..."></label><div class="top-actions"><button id="notificationBtn" class="icon-btn" aria-label="Notifications">♧<i></i></button><div class="avatar">CM</div><div><strong>Ciara Murphy</strong><small>Underwriter</small></div><button id="profileBtn" class="icon-btn">⌄</button></div></header><main id="app"></main></div>
<dialog id="newCaseDialog"><form method="dialog" id="newCaseForm"><div class="dialog-head"><div><small>NEW APPLICATION</small><h2>Create mortgage case</h2></div><button value="cancel" class="close" aria-label="Close">×</button></div><div class="form-grid"><label>Applicant name<input name="applicant" required value="Niamh & Sean Kelly"></label><label>Location<input name="location" required value="Cork, T12"></label><label>Property value (€)<input name="propertyValue" type="number" min="1" required value="390000"></label><label>Loan amount (€)<input name="loanAmount" type="number" min="1" required value="300000"></label><label>Gross annual income (€)<input name="income" type="number" min="1" required value="92000"></label><label>Monthly committed outgoings (€)<input name="debt" type="number" min="0" required value="1750"></label><label>Term (years)<input name="term" type="number" min="5" max="40" required value="30"></label><label>Product<select name="product"><option>Variable Rate (Green Home)</option><option>3 Year Fixed</option><option>5 Year Fixed</option></select></label></div><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button type="submit" value="default" class="primary">Create & assess case →</button></div></form></dialog>
<dialog id="actionDialog"><form method="dialog"><div class="dialog-head"><div><small>CASE ACTIONS</small><h2>Choose next step</h2></div><button value="cancel" class="close">×</button></div><div class="action-list"><button value="info" data-action="info">Request further information <span>→</span></button><button value="review" data-action="review">Move to manual review <span>→</span></button><button value="approve" data-action="approve">Approve subject to conditions <span>→</span></button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="model.js"></script><script src="app.js"></script></body></html>
